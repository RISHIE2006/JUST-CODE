<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="iPhone-style phone mockup with dynamic music player notch and color theme switcher — Deep Purple, Gold, Space Black, and Silver.">
    <meta name="author" content="JUST CODE">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap">
    <link rel="stylesheet" href="style.css">
    <title>Phone Mockup — Music Notch</title>
</head>
<body>

<!-- Hidden radio buttons control the active color theme -->
<input type="radio" name="theme" id="deep-purple" checked="checked">
<input type="radio" name="theme" id="gold">
<input type="radio" name="theme" id="space-black">
<input type="radio" name="theme" id="silver">

<div class="phone">
    <!-- Physical side buttons -->
    <div class="buttons">
        <div class="left">
            <div class="button" title="Silent switch"></div>
            <div class="button" title="Volume up"></div>
            <div class="button" title="Volume down"></div>
        </div>
        <div class="right">
            <div class="button" title="Power / Side button"></div>
        </div>
    </div>

    <!-- Front camera pill -->
    <div class="camera" aria-hidden="true"></div>

    <!-- Screen background gradient layers (one per theme) -->
    <div class="screen-container">
        <div class="bg">
            <div class="deep-purple">
                <div class="section"><div class="glow"></div></div>
                <div class="section"><div class="glow"></div></div>
            </div>
            <div class="gold">
                <div class="section"><div class="glow"></div></div>
                <div class="section"><div class="glow"></div></div>
            </div>
            <div class="space-black">
                <div class="section"><div class="glow"></div></div>
                <div class="section"><div class="glow"></div></div>
            </div>
            <div class="silver">
                <div class="section"><div class="glow"></div></div>
                <div class="section"><div class="glow"></div></div>
            </div>
        </div>
    </div>

    <!-- Dynamic Island / Notch — hover or focus to expand music player -->
    <div class="notch-container" tabindex="0" role="region" aria-label="Music player">
        <div class="notch">
            <div class="content">
                <div class="left">
                    <div class="title" aria-hidden="true"></div>
                    <div class="text">
                        <span class="song-name">Blinding Lights</span>
                        <span class="artist-name">The Weeknd</span>
                    </div>
                </div>
                <div class="right">
                    <div class="bar">
                        <div class="duration"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="notch-blur" aria-hidden="true"></div>
    </div>

    <!-- Color swatch palette -->
    <div class="pallette" role="group" aria-label="Color theme selector">
        <label for="deep-purple" class="swatch" title="Deep Purple" aria-label="Deep Purple theme"></label>
        <label for="gold"        class="swatch" title="Gold"        aria-label="Gold theme"></label>
        <label for="space-black" class="swatch" title="Space Black" aria-label="Space Black theme"></label>
        <label for="silver"      class="swatch" title="Silver"      aria-label="Silver theme"></label>
    </div>
</div>

<!-- Screen reader label -->
<p class="sr-only">Select a color theme using the swatches below the phone. Hover or focus the Dynamic Island notch to reveal the music player.</p>

</body>
</html>
